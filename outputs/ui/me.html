<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=375,initial-scale=1">
<style>
  html, body { margin:0; padding:0; }
  body { width:375px; min-height:100%; }
  /* 小程序里 <image> 未指定尺寸时按 320x240 的默认盒子渲染 ——
     这里照样给默认值，才能让「忘了写尺寸」的坑在截图上暴露出来 */
  img { display:inline-block; width:320px; height:240px; vertical-align:middle; }
  div { display:block; }
  input, textarea { font-family:inherit; font-size:inherit; border:none; outline:none; background:none; }
  input::placeholder, textarea::placeholder { color:#A39B90; }
  /*
   * ★ 动画必须"立即跑完"，否则截图拍到的是**初始态**。
   *
   * 本项目大量用 animation: x .5s ... backwards 做入场编排，
   * backwards 填充意味着 t=0 时元素就是 opacity:0 / translateY(...)。
   * 无头 Chrome 截图不等动画 → 拍出来整页空白
   *（第一版就是：只剩 hero 的色块底，一个字都没有）。
   *
   * 用 duration:0s + delay:0s 让动画瞬间到 100%，
   * 保留"最终态"，不改变任何布局结果。
   */
  *, *::before, *::after {
    animation-duration: .001s !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0s !important;
  }
</style>
<style> body {
  --brand: #E0714F;        
  --brand2: #C4573A;       
  --brandsoft: #F5DDD3;
  --gold: #E8B33C;         
  --goldsoft: #F6E7C3;
  --blue: #5E7FA6;         
  --bluesoft: #E4EBF3;
  --green: #6D9E6A;        
  --greensoft: #EAF0E9;
  --bg: #F5F0EA;           
  --card: #FFFDF9;
  --ink: #2C2822;
  --ink2: #6E675E;
  --ink3: #A39B90;
  --line: #E7DFD3;

  
  --gap-1: 8px;
  --gap-2: 12px;
  --gap-3: 16px;

  
  --sh-1: 0 1px 4px rgba(88, 68, 48, .045);   
  --sh-2: 0 3px 10px rgba(88, 68, 48, .075);  
  --sh-3: 0 6px 16px rgba(88, 68, 48, .11);  

  
  --r-1: 8px;   
  --r-2: 12px;   
  --r-3: 16px;   

  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

view, text, button, input, textarea { box-sizing: border-box }


.card {
  background: var(--card);
  border-radius: var(--r-2);
  padding: 14px;
  margin-bottom: var(--gap-2);
  box-shadow: var(--sh-1);
}
.card.hl { border: 1.5px solid var(--brand); box-shadow: var(--sh-2) }
.card.flat { background: #F5F1EB; box-shadow: none }

.lbl {
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 7px;
}
.q { font-size: 16px; font-weight: 600; line-height: 1.5 }
.note { font-size: 11.5px; color: var(--ink2); line-height: 1.7 }
.sm { font-size: 11.5px }
.xs { font-size: 10.5px; color: var(--ink3); line-height: 1.6 }


.hero {
  background: linear-gradient(135deg, #E0714F, #C4573A);
  color: #fff;
  border-radius: 14px;
  padding: 16px 14px;
  margin-bottom: 12px;
}
.hero .big { font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -1px }
.hero .sub { font-size: 11.5px; opacity: .9; margin-top: 5px }


.btn {
  height: 44px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  background: #F0EAE1;
  color: var(--ink2);
}
.btn.main { background: var(--brand); color: #fff }
.btn.ok { background: var(--greensoft); color: var(--green) }
.btn.ghostb { background: transparent; border: 1px solid var(--brand); color: var(--brand2) }
.btn.on { background: var(--brand); color: #fff }
.btn:active { opacity: .82 }
.btn.disabled { opacity: .45 }


.pill {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 499.5px;
  background: var(--brandsoft);
  color: var(--brand2);
  font-weight: 600;
}
.pill.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink3); font-weight: 400 }
.pill.gold { background: var(--goldsoft); color: #8A6A22 }
.pill.green { background: var(--greensoft); color: var(--green) }
.pill.blue { background: var(--bluesoft); color: var(--blue) }


.who { display: flex }
.av {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
}
.av.a { background: var(--brand) }
.av.b { background: var(--blue); margin-left: -7px; box-shadow: 0 0 0 2px var(--bg) }


.side { border-radius: 10px; padding: 11px 12px; font-size: 13px; line-height: 1.75 }
.side.ta { background: var(--bluesoft) }
.side.me { background: var(--brandsoft) }
.side .n { font-size: 11px; color: var(--ink2); margin-bottom: 4px; display: flex; align-items: center; gap: 4px }
.rd { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block }
.rd.b { background: var(--blue) }


.lockbar {
  display: flex; align-items: center; gap: 7px;
  background: #F5F1EB; border-radius: 10px;
  padding: 10px 11px; font-size: 11.5px; color: var(--ink2);
  margin-bottom: 11px;
}


.ta {
  width: 100%; height: 140px;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 11px; font-size: 13.5px; line-height: 1.75;
  background: #FDFBF8;
}
.cnt { text-align: right; font-size: 10.5px; color: var(--ink3); margin-top: 4px }


.row2 { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line) }
.row2:last-child { border-bottom: none }
.ico { width: 32px; height: 32px; border-radius: 50%; background: #F2ECE4; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0 }
.gt { font-size: 13px; font-weight: 600 }
.cd { font-size: 10.5px; font-weight: 700; color: var(--brand2); background: var(--brandsoft); padding: 4px 7px; border-radius: 7px; flex-shrink: 0 }
.cd.far { background: #F2ECE4; color: var(--ink2); font-weight: 400 }


.mile { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 3px }
.m { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; color: var(--ink3); flex: 1 }
.m .bar { width: 100%; height: 3px; background: var(--line); border-radius: 1.5px }
.m .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line) }
.m.done .dot { background: var(--gold) }
.m.done { color: var(--ink2) }
.m.now .dot { background: var(--brand); box-shadow: 0 0 0 3px var(--brandsoft) }
.m.now { color: var(--brand2); font-weight: 700 }


.chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px }
.chiprow .pill { flex: none }



.page { padding: 14px 14px calc(70px + env(safe-area-inset-bottom)) }
.empty { text-align: center; padding: 40px 20px; color: var(--ink3); font-size: 12.5px; line-height: 1.8 }
.divider { height: 1px; background: var(--line); margin: 12px 0 }





.mi { width: 1em; height: 1em; vertical-align: -0.14em; margin-right: 3px; }


.bigicon { width: 48px; height: 48px; }
.bigicon.sm { width: 34px; height: 34px; }


.tick { width: 13px; height: 13px; }




.meprof {
  display: flex; align-items: center; gap: 11px;
  padding: 15px 14px; margin-bottom: var(--gap-2);
  background: var(--card); border-radius: var(--r-3);
  box-shadow: var(--sh-2);
}
.meav {
  width: 48px; height: 48px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #E88060, #C24E2F);
  box-shadow: var(--sh-1);
}
.meinfo { flex: 1; min-width: 0 }
.mein {
  width: 100%; height: 30px;
  font-size: 17px; font-weight: 600; color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.ph { color: var(--ink3); font-weight: 400 }
.meprof-s { font-size: 10.5px; color: var(--ink3); margin-top: 5px }


.rline {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
.rline:last-child { border-bottom: none; padding-bottom: 2px }
.rl-main { flex: 1; min-width: 0 }
.rl-t { font-size: 14px; font-weight: 600; color: var(--ink) }
.rl-s { font-size: 10.5px; color: var(--ink3); margin-top: 3px; line-height: 1.55 }


.sw {
  width: 42px; height: 24px; border-radius: 499.5px; flex: none;
  background: #E2DAD0; position: relative;
  transition: background .2s;
}
.sw.on { background: var(--brand) }
.swdot {
  position: absolute; top: 2.5px; left: 2.5px;
  width: 19px; height: 19px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18);
  transition: transform .2s cubic-bezier(.22, 1, .36, 1);
}
.sw.on .swdot { transform: translateX(18px) }


.row2-main { flex: 1; min-width: 0 }
.row2-arrow { width: 14px; height: 14px; opacity: .4; flex: none }
.mi-icon { width: 18px; height: 18px }


.about { font-size: 11.5px; color: var(--ink2); line-height: 1.9 }
.ab-line { display: block }
.ab-ver { margin-top: 7px; font-size: 10px; color: var(--ink3); letter-spacing: 0.5px }

.foot-tip {
  margin-top: 9px; text-align: center;
  font-size: 10px; color: var(--ink3); line-height: 1.7;
}
</style>
</head><body>
<!-- 小程序导航栏（简写近似） -->
<div style="height:44px;display:flex;align-items:center;justify-content:center;

<div class="page">
  
  <div class="meprof">
    <div class="meav">邓</div>
    <div class="meinfo">
      <input class="mein" value="邓林" placeholder="起个名字" data-maxlength="12">
      <div class="meprof-s">房间里别人看到的就是这个名字</div>

  </div>

  
  <div class="card">
    <div class="lbl">声音与振动</div>
    <div class="rline">
      <div class="rl-main">
        <div class="rl-t">音效</div>
        <div class="rl-s">摇盅、扣盅、开盅都是合成音，不是随便的 beep</div>
      </div>
      <div class="sw on"><div class="swdot"></div></div>
    </div>
    <div class="rline">
      <div class="rl-main">

  <div class="card">
    <div class="lbl">玩法</div>
    <div class="row2">
      <div class="ico"><img class="mi-icon" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%23C4553F%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%223.5%22%20y%3D%223.5%22%20width%3D%2217%22%20height%3D%2217%22%20rx%3D%223.4%22%2F%3E%3Ccircle%20cx%3D%228.3%22%20cy%3D%228.3%22%20r%3D%221.35%22%20fill%3D%22currentColor%22%20stroke%3D%22none%22%2F%3E%3Ccircle%20cx%3D%2215.7%22%20cy%3D%228.3%22%20r%3D%221.35%22%20fill%3D%22currentColor%22%20stroke%3D%22none%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%221.35%22%20fill%3D%22currentColor%22%20stroke%3D%22none%22%2F%3E%3Ccircle%20cx%3D%228.3%22%20cy%3D%2215.7%22%20r%3D%221.35%22%20fill%3D%22currentColor%22%20stroke%3D%22none%22%2F%3E%3Ccircle%20cx%3D%2215.7%22%20cy%3D%2215.7%22%20r%3D%221.35%22%20fill%3D%22currentColor%22%20stroke%3D%22none%22%2F%3E%3C%2Fsvg%3E" data-mode="aspectFit" style="object-fit:contain;"></div>
      <div class="row2-main">
        <div class="gt">一共 3 个玩法</div>
        <div class="xs">大话骰 · 比大小 · 命运转盘</div>
      </div>
      <img class="row2-arrow" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%23C4553F%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9.5%206l6%206-6%206%22%2F%3E%3C%2Fsvg%3E" data-mode="aspectFit" style="object-fit:contain;">
    </div>
  </div>

  
  <div class="card flat">
    <div class="lbl">关于</div>
    <div class="about">

      <div class="ab-ver">v3.0.0</div>

  </div>

  <div class="btn ghostb">清理本机缓存</div>
  <div class="foot-tip">清理只会清掉昵称和开关状态，不影响任何对局数据</div>
</div>
