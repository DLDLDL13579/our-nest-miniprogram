<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=375,initial-scale=1">
<style>
  html, body { margin:0; padding:0; }
  body { width:375px; min-height:100%; }
  /* 小程序里 <image> 未指定尺寸时按 320x240 的默认盒子渲染 ——
     这里照样给默认值，才能让「忘了写尺寸」的坑在截图上暴露出来 */
  img { display:inline-block; width:320px; height:240px; vertical-align:middle; }
  div { display:block; }
  input, textarea { font-family:inherit; font-size:inherit; border:none; outline:none; background:none; }
  input::placeholder, textarea::placeholder { color:#A39B90; }
  /*
   * ★ 动画必须"立即跑完"，否则截图拍到的是**初始态**。
   *
   * 本项目大量用 animation: x .5s ... backwards 做入场编排，
   * backwards 填充意味着 t=0 时元素就是 opacity:0 / translateY(...)。
   * 无头 Chrome 截图不等动画 → 拍出来整页空白
   *（第一版就是：只剩 hero 的色块底，一个字都没有）。
   *
   * 用 duration:0s + delay:0s 让动画瞬间到 100%，
   * 保留"最终态"，不改变任何布局结果。
   */
  *, *::before, *::after {
    animation-duration: .001s !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0s !important;
  }
</style>
<style> body {
  --brand: #E0714F;        
  --brand2: #C4573A;       
  --brandsoft: #F5DDD3;
  --gold: #E8B33C;         
  --goldsoft: #F6E7C3;
  --blue: #5E7FA6;         
  --bluesoft: #E4EBF3;
  --green: #6D9E6A;        
  --greensoft: #EAF0E9;
  --bg: #F5F0EA;           
  --card: #FFFDF9;
  --ink: #2C2822;
  --ink2: #6E675E;
  --ink3: #A39B90;
  --line: #E7DFD3;

  
  --gap-1: 8px;
  --gap-2: 12px;
  --gap-3: 16px;

  
  --sh-1: 0 1px 4px rgba(88, 68, 48, .045);   
  --sh-2: 0 3px 10px rgba(88, 68, 48, .075);  
  --sh-3: 0 6px 16px rgba(88, 68, 48, .11);  

  
  --r-1: 8px;   
  --r-2: 12px;   
  --r-3: 16px;   

  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

view, text, button, input, textarea { box-sizing: border-box }


.card {
  background: var(--card);
  border-radius: var(--r-2);
  padding: 14px;
  margin-bottom: var(--gap-2);
  box-shadow: var(--sh-1);
}
.card.hl { border: 1.5px solid var(--brand); box-shadow: var(--sh-2) }
.card.flat { background: #F5F1EB; box-shadow: none }

.lbl {
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 7px;
}
.q { font-size: 16px; font-weight: 600; line-height: 1.5 }
.note { font-size: 11.5px; color: var(--ink2); line-height: 1.7 }
.sm { font-size: 11.5px }
.xs { font-size: 10.5px; color: var(--ink3); line-height: 1.6 }


.hero {
  background: linear-gradient(135deg, #E0714F, #C4573A);
  color: #fff;
  border-radius: 14px;
  padding: 16px 14px;
  margin-bottom: 12px;
}
.hero .big { font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -1px }
.hero .sub { font-size: 11.5px; opacity: .9; margin-top: 5px }


.btn {
  height: 44px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  background: #F0EAE1;
  color: var(--ink2);
}
.btn.main { background: var(--brand); color: #fff }
.btn.ok { background: var(--greensoft); color: var(--green) }
.btn.ghostb { background: transparent; border: 1px solid var(--brand); color: var(--brand2) }
.btn.on { background: var(--brand); color: #fff }
.btn:active { opacity: .82 }
.btn.disabled { opacity: .45 }


.pill {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 499.5px;
  background: var(--brandsoft);
  color: var(--brand2);
  font-weight: 600;
}
.pill.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink3); font-weight: 400 }
.pill.gold { background: var(--goldsoft); color: #8A6A22 }
.pill.green { background: var(--greensoft); color: var(--green) }
.pill.blue { background: var(--bluesoft); color: var(--blue) }


.who { display: flex }
.av {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
}
.av.a { background: var(--brand) }
.av.b { background: var(--blue); margin-left: -7px; box-shadow: 0 0 0 2px var(--bg) }


.side { border-radius: 10px; padding: 11px 12px; font-size: 13px; line-height: 1.75 }
.side.ta { background: var(--bluesoft) }
.side.me { background: var(--brandsoft) }
.side .n { font-size: 11px; color: var(--ink2); margin-bottom: 4px; display: flex; align-items: center; gap: 4px }
.rd { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block }
.rd.b { background: var(--blue) }


.lockbar {
  display: flex; align-items: center; gap: 7px;
  background: #F5F1EB; border-radius: 10px;
  padding: 10px 11px; font-size: 11.5px; color: var(--ink2);
  margin-bottom: 11px;
}


.ta {
  width: 100%; height: 140px;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 11px; font-size: 13.5px; line-height: 1.75;
  background: #FDFBF8;
}
.cnt { text-align: right; font-size: 10.5px; color: var(--ink3); margin-top: 4px }


.row2 { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line) }
.row2:last-child { border-bottom: none }
.ico { width: 32px; height: 32px; border-radius: 50%; background: #F2ECE4; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0 }
.gt { font-size: 13px; font-weight: 600 }
.cd { font-size: 10.5px; font-weight: 700; color: var(--brand2); background: var(--brandsoft); padding: 4px 7px; border-radius: 7px; flex-shrink: 0 }
.cd.far { background: #F2ECE4; color: var(--ink2); font-weight: 400 }


.mile { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 3px }
.m { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; color: var(--ink3); flex: 1 }
.m .bar { width: 100%; height: 3px; background: var(--line); border-radius: 1.5px }
.m .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line) }
.m.done .dot { background: var(--gold) }
.m.done { color: var(--ink2) }
.m.now .dot { background: var(--brand); box-shadow: 0 0 0 3px var(--brandsoft) }
.m.now { color: var(--brand2); font-weight: 700 }


.chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px }
.chiprow .pill { flex: none }



.page { padding: 14px 14px calc(70px + env(safe-area-inset-bottom)) }
.empty { text-align: center; padding: 40px 20px; color: var(--ink3); font-size: 12.5px; line-height: 1.8 }
.divider { height: 1px; background: var(--line); margin: 12px 0 }





.mi { width: 1em; height: 1em; vertical-align: -0.14em; margin-right: 3px; }


.bigicon { width: 48px; height: 48px; }
.bigicon.sm { width: 34px; height: 34px; }


.tick { width: 13px; height: 13px; }




.lb-hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-3); margin-bottom: var(--gap-3);
  background: linear-gradient(135deg, #3E2E28 0%, #2E211C 60%, #241A16 100%);
  box-shadow: var(--sh-3);
  animation: heroDrop .62s cubic-bezier(.22, 1.4, .5, 1) backwards;
}
@keyframes heroDrop {
  0%   { opacity: 0; transform: translateY(-17px) scale(.96) }
  62%  { opacity: 1; transform: translateY(2.5px) scale(1.01) }
  100% { opacity: 1; transform: translateY(0) scale(1) }
}


.lb-glow {
  position: absolute; width: 200px; height: 200px; border-radius: 50%;
  right: -65px; top: -80px;
  background: radial-gradient(circle, rgba(232,179,60,.28) 0%, rgba(232,179,60,0) 70%);
  animation: glowBreathe 4s ease-in-out infinite;
}
@keyframes glowBreathe {
  0%, 100% { opacity: .7; transform: scale(1) }
  50%      { opacity: 1;  transform: scale(1.12) }
}

.lb-in { position: relative; padding: 17px 17px 15px }
.lb-top { display: flex; align-items: center; justify-content: space-between }
.lb-lbl {
  font-size: 11px; color: rgba(255,255,255,.55); letter-spacing: 2px;
  animation: lineRise .5s cubic-bezier(.22, 1, .36, 1) .16s backwards;
}
.lb-t {
  font-size: 26px; font-weight: 700; color: #F6E7C3;
  margin-top: 3px; letter-spacing: 1.5px; line-height: 1.15;
  animation: lineRise .5s cubic-bezier(.22, 1, .36, 1) .24s backwards;
}
.lb-s {
  font-size: 11px; color: rgba(255,255,255,.5); margin-top: 6px; line-height: 1.6;
  animation: lineRise .5s cubic-bezier(.22, 1, .36, 1) .32s backwards;
}
@keyframes lineRise {
  0%   { opacity: 0; transform: translateY(7px) }
  100% { opacity: 1; transform: translateY(0) }
}


.lb-switches { display: flex; align-items: center; gap: 4px }
.lb-sw {
  width: 18px; height: 18px; flex: none;
  padding: 3px; box-sizing: border-box; opacity: .75;
  animation: lineRise .5s cubic-bezier(.22, 1, .36, 1) .4s backwards;
}
.lb-sw.off { opacity: .34 }
.lb-sw:active { opacity: 1; transform: scale(1.15) }


.joinbar {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 6px 6px 12px; margin-bottom: var(--gap-2);
  background: var(--card); border-radius: var(--r-2);
  box-shadow: var(--sh-2);
  border: 1px solid var(--line);
  animation: lineRise .5s cubic-bezier(.22, 1, .36, 1) .22s backwards;
}
.join-in {
  flex: 1; min-width: 0; height: 34px;
  font-size: 15px; color: var(--ink); letter-spacing: 2px;
}
.ph { color: var(--ink3); letter-spacing: 0.5px }
.join-btn {
  flex: none; height: 34px; padding: 0 19px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 9px; font-size: 14px; font-weight: 600;
  
  background: #F0EAE1; color: var(--ink3);
  transition: background .16s, color .16s;
}
.join-btn.on { background: var(--brand); color: #fff }
.join-btn.on:active { opacity: .82 }

.errbox {
  margin: 0 0 var(--gap-2); padding: 9px 11px;
  background: #FBEDE7; border-left: 3px solid var(--brand2);
  border-radius: 7px; font-size: 11.5px; color: var(--brand2); line-height: 1.6;
}


.glist { display: flex; flex-direction: column }

.gcard {
  display: flex; align-items: center; gap: 11px;
  padding: 13px 12px 13px 11px; margin-bottom: var(--gap-2);
  background: var(--card); border-radius: var(--r-2);
  box-shadow: var(--sh-1);
  
  border-left: 4px solid var(--accent, var(--brand));
  transition: transform .12s, box-shadow .12s;
  
  animation: cardSlideIn .5s cubic-bezier(.22, 1, .36, 1) backwards;
}
.gcard:nth-of-type(1) { animation-delay: .32s }
.gcard:nth-of-type(2) { animation-delay: .40s }
.gcard:nth-of-type(3) { animation-delay: .48s }
.gcard:nth-of-type(4) { animation-delay: .56s }
.gcard:nth-of-type(5) { animation-delay: .64s }
.gcard:nth-of-type(6) { animation-delay: .72s }
@keyframes cardSlideIn {
  0%   { opacity: 0; transform: translateX(20px) }
  100% { opacity: 1; transform: translateX(0) }
}
.gcard:active { transform: scale(.985); box-shadow: var(--sh-2) }

.gc-icon {
  width: 46px; height: 46px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #F6E9D8, #EBD8C0);
  border: 1px solid rgba(200, 160, 120, .28);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.7);
  padding: 9px; box-sizing: border-box;
  transition: transform .2s;
}
.gcard:active .gc-icon { transform: scale(1.1) rotate(-6deg) }

.gc-img { width: 100%; height: 100% }

.gc-main { flex: 1; min-width: 0 }
.gc-top { display: flex; align-items: center; gap: 7px }
.gc-name { font-size: 16px; font-weight: 700; color: var(--ink) }
.gc-people {
  font-size: 9.5px; padding: 1.5px 6px; border-radius: 499.5px;
  background: var(--brandsoft); color: var(--brand2); flex: none;
}
.gc-desc { font-size: 11.5px; color: var(--ink2); margin-top: 4px; line-height: 1.55 }
.gc-arrow {
  width: 16px; height: 16px; flex: none; opacity: .38;
  transition: transform .2s;
}
.gcard:active .gc-arrow { transform: translateX(3px) }


.lb-tip {
  margin-top: 4px; padding: 12px 13px;
  background: #F5F1EB; border-radius: var(--r-2);
  font-size: 10.5px; color: var(--ink3); line-height: 1.9;
  animation: lineRise .5s cubic-bezier(.22, 1, .36, 1) .78s backwards;
}
.tip-line { display: block }

</style>
</head><body>
