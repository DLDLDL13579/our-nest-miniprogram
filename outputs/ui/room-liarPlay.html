<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=375,initial-scale=1">
<style>
  html, body { margin:0; padding:0; }
  body { width:375px; min-height:100%; }
  /* 小程序里 <image> 未指定尺寸时按 320x240 的默认盒子渲染 ——
     这里照样给默认值，才能让「忘了写尺寸」的坑在截图上暴露出来 */
  img { display:inline-block; width:320px; height:240px; vertical-align:middle; }
  div { display:block; }
  input, textarea { font-family:inherit; font-size:inherit; border:none; outline:none; background:none; }
  input::placeholder, textarea::placeholder { color:#A39B90; }
  /*
   * ★ 动画必须"立即跑完"，否则截图拍到的是**初始态**。
   *
   * 本项目大量用 animation: x .5s ... backwards 做入场编排，
   * backwards 填充意味着 t=0 时元素就是 opacity:0 / translateY(...)。
   * 无头 Chrome 截图不等动画 → 拍出来整页空白
   *（第一版就是：只剩 hero 的色块底，一个字都没有）。
   *
   * 用 duration:0s + delay:0s 让动画瞬间到 100%，
   * 保留"最终态"，不改变任何布局结果。
   */
  *, *::before, *::after {
    animation-duration: .001s !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0s !important;
  }
</style>
<style> body {
  --brand: #E0714F;        
  --brand2: #C4573A;       
  --brandsoft: #F5DDD3;
  --gold: #E8B33C;         
  --goldsoft: #F6E7C3;
  --blue: #5E7FA6;         
  --bluesoft: #E4EBF3;
  --green: #6D9E6A;        
  --greensoft: #EAF0E9;
  --bg: #F5F0EA;           
  --card: #FFFDF9;
  --ink: #2C2822;
  --ink2: #6E675E;
  --ink3: #A39B90;
  --line: #E7DFD3;

  
  --gap-1: 8px;
  --gap-2: 12px;
  --gap-3: 16px;

  
  --sh-1: 0 1px 4px rgba(88, 68, 48, .045);   
  --sh-2: 0 3px 10px rgba(88, 68, 48, .075);  
  --sh-3: 0 6px 16px rgba(88, 68, 48, .11);  

  
  --r-1: 8px;   
  --r-2: 12px;   
  --r-3: 16px;   

  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 13.5px;
  line-height: 1.6;
}

view, text, button, input, textarea { box-sizing: border-box }


.card {
  background: var(--card);
  border-radius: var(--r-2);
  padding: 14px;
  margin-bottom: var(--gap-2);
  box-shadow: var(--sh-1);
}
.card.hl { border: 1.5px solid var(--brand); box-shadow: var(--sh-2) }

.card.flat { background: rgba(255, 255, 255, .05); box-shadow: none }

.lbl {
  font-size: 10.5px;
  color: var(--ink3);
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 7px;
}
.q { font-size: 16px; font-weight: 600; line-height: 1.5 }
.note { font-size: 12px; color: var(--ink2); line-height: 1.7 }
.sm { font-size: 12px }
.xs { font-size: 10.5px; color: var(--ink3); line-height: 1.6 }


.hero {
  background: linear-gradient(135deg, #E0714F, #C4573A);
  color: #fff;
  border-radius: 14px;
  padding: 16px 14px;
  margin-bottom: 12px;
}
.hero .big { font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -1px }
.hero .sub { font-size: 12px; opacity: .9; margin-top: 5px }


.btn {
  height: 44px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
  background: #F0EAE1;
  color: var(--ink2);
}
.btn.main { background: var(--brand); color: #fff }
.btn.ok { background: var(--greensoft); color: var(--green) }
.btn.ghostb { background: transparent; border: 1px solid var(--brand); color: var(--brand2) }
.btn.on { background: var(--brand); color: #fff }
.btn:active { opacity: .82 }
.btn.disabled { opacity: .45 }


.pill {
  font-size: 10.5px;
  padding: 4px 10px;
  border-radius: 499.5px;
  background: var(--brandsoft);
  color: var(--brand2);
  font-weight: 600;
}
.pill.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink3); font-weight: 400 }
.pill.gold { background: var(--goldsoft); color: #8A6A22 }
.pill.green { background: var(--greensoft); color: var(--green) }
.pill.blue { background: var(--bluesoft); color: var(--blue) }


.who { display: flex }
.av {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
}
.av.a { background: var(--brand) }
.av.b { background: var(--blue); margin-left: -7px; box-shadow: 0 0 0 2px var(--bg) }


.side { border-radius: 10px; padding: 11px 12px; font-size: 13.5px; line-height: 1.75 }
.side.ta { background: var(--bluesoft) }
.side.me { background: var(--brandsoft) }
.side .n { font-size: 10.5px; color: var(--ink2); margin-bottom: 4px; display: flex; align-items: center; gap: 4px }
.rd { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block }
.rd.b { background: var(--blue) }


.lockbar {
  display: flex; align-items: center; gap: 7px;
  background: #F5F1EB; border-radius: 10px;
  padding: 10px 11px; font-size: 12px; color: var(--ink2);
  margin-bottom: 11px;
}


.ta {
  width: 100%; height: 140px;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 11px; font-size: 13.5px; line-height: 1.75;
  background: #FDFBF8;
}
.cnt { text-align: right; font-size: 10.5px; color: var(--ink3); margin-top: 4px }


.row2 { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line) }
.row2:last-child { border-bottom: none }
.ico { width: 32px; height: 32px; border-radius: 50%; background: #F2ECE4; display: flex; align-items: center; justify-content: center; font-size: 13.5px; flex-shrink: 0 }
.gt { font-size: 13.5px; font-weight: 600 }
.cd { font-size: 10.5px; font-weight: 700; color: var(--brand2); background: var(--brandsoft); padding: 4px 7px; border-radius: 7px; flex-shrink: 0 }
.cd.far { background: #F2ECE4; color: var(--ink2); font-weight: 400 }


.mile { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 3px }
.m { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink3); flex: 1 }
.m .bar { width: 100%; height: 3px; background: var(--line); border-radius: 1.5px }
.m .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line) }
.m.done .dot { background: var(--gold) }
.m.done { color: var(--ink2) }
.m.now .dot { background: var(--brand); box-shadow: 0 0 0 3px var(--brandsoft) }
.m.now { color: var(--brand2); font-weight: 700 }


.chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px }
.chiprow .pill { flex: none }



.page { padding: 14px 14px calc(70px + env(safe-area-inset-bottom)) }
.empty { text-align: center; padding: 40px 20px; color: var(--ink3); font-size: 12px; line-height: 1.8 }
.divider { height: 1px; background: var(--line); margin: 12px 0 }





.mi { width: 1em; height: 1em; vertical-align: -0.14em; margin-right: 3px; }


.bigicon { width: 48px; height: 48px; }
.bigicon.sm { width: 34px; height: 34px; }


.tick { width: 13px; height: 13px; }



.gamepage {
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 20%, #3A2B24 0%, #241A16 75%);
  padding: 0 16px calc(25px + env(safe-area-inset-bottom));
}


.pg-tex {
  position: fixed; left: 0; top: 0;
  width: 100vw; height: 100vh;
  opacity: .05;
  z-index: 0;
  pointer-events: none;
}


.confetti {
  position: fixed; left: 0; top: 0;
  width: 100vw; height: 100vh;
  overflow: hidden;
  pointer-events: none;
  z-index: 20;
}
.cf {
  position: absolute;
  top: -15px;
  width: 6px; height: 10px;
  border-radius: 1px;
  animation: cfFall 2.4s linear forwards;
}
@keyframes cfFall {
  0%   { transform: translateY(0) rotate(0deg);        opacity: 1 }
  85%  { opacity: 1 }
  100% { transform: translateY(110vh) rotate(720deg);  opacity: 0 }
}

.cf-0 { background: #E8B33C }
.cf-1 { background: #E0714F }
.cf-2 { background: #6D9E6A }
.cf-3 { background: #5E7FA6 }
.cf-4 { background: #C9A0DC }

.cf:nth-child(4n+1) { left: 8%;  animation-delay: 0ms;   animation-duration: 2.3s }
.cf:nth-child(4n+2) { left: 31%; animation-delay: 120ms; animation-duration: 2.5s }
.cf:nth-child(4n+3) { left: 58%; animation-delay: 60ms;  animation-duration: 2.2s }
.cf:nth-child(4n+4) { left: 82%; animation-delay: 180ms; animation-duration: 2.6s }

.cf:nth-child(3n)   { margin-left: 5px }
.cf:nth-child(5n)   { margin-left: -7px }

.gbar {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 5px;
}

.gbar-mid {
  display: flex; align-items: baseline; gap: 5px;
  padding: 3px 9px; border-radius: 499.5px;
  background: rgba(255,255,255,.06);
}
.gbar-code {
  
  font-family: 'BebasNum', -apple-system, sans-serif;
  font-size: 16px; font-weight: 700; color: #F6E7C3;
  letter-spacing: 2px;
}
.gbar-codelbl { font-size: 9px; color: rgba(255,255,255,.52) }
.gbar-mid:active { background: rgba(232,179,60,.18) }

.gbar-l { display: flex; align-items: center; gap: 5px; padding: 5px 3px }
.gbar-back { font-size: 22px; color: rgba(255,255,255,.7); line-height: 1 }
.gbar-t { font-size: 16px; color: rgba(255,255,255,.85); font-weight: 600 }
.gbar-r { padding: 5px 7px }
.gbar-mute { width: 17px; height: 17px }   

.nettip {
  margin-top: 6px; padding: 8px 11px; border-radius: 8px;
  background: rgba(232,179,60,.16); color: #E8B33C;
  font-size: 10.5px; text-align: center;
  animation: fadeIn .25s cubic-bezier(0, 0, .2, 1);
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }


.entry-hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-3); margin-bottom: var(--gap-3);
  background: linear-gradient(135deg, #4A3630 0%, #33241E 100%);
  box-shadow: var(--sh-3);
}
.eh-glow {
  position: absolute; width: 190px; height: 190px; border-radius: 50%;
  right: -60px; top: -75px;
  background: radial-gradient(circle, rgba(94,127,166,.35) 0%, rgba(94,127,166,0) 70%);
  animation: glowBreathe 4s ease-in-out infinite;
}
@keyframes glowBreathe {
  0%, 100% { opacity: .7; transform: scale(1) }
  50%      { opacity: 1;  transform: scale(1.12) }
}
.eh-in { position: relative; padding: 18px 17px 16px }
.eh-lbl { font-size: 10.5px; color: rgba(255,255,255,.5); letter-spacing: 1.5px }
.eh-t { font-size: 22px; font-weight: 700; color: #D6E4F5; margin-top: 4px; letter-spacing: 1px }
.eh-s { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 6px; line-height: 1.7 }


.gamepage .card {
  background: rgba(255,255,255,.07);
  box-shadow: none;
  border: 1px solid rgba(255,255,255,.09);
}
.gamepage .card.hl { border-color: rgba(232,179,60,.4) }
.gamepage .lbl { color: rgba(255, 255, 255, 0.52) }
.gamepage .hint { color: rgba(255, 255, 255, 0.52) }
.gamepage .tin {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.14);
  color: #F6E7C3;
}
.gamepage .ph { color: rgba(255,255,255,.28) }
.gamepage .chiprow .pill { background: rgba(232,179,60,.22); color: #F6E7C3 }
.gamepage .chiprow .pill.ghost {
  background: transparent; color: rgba(255, 255, 255, 0.52);
  border-color: rgba(255,255,255,.18);
}


.pill-icon {
  width: 15px; height: 15px;
  display: inline-block;
  vertical-align: -2.5px;
  margin-right: 4px;
}

.pill.ghost .pill-icon { opacity: .55 }
.gamepage .sechead { color: rgba(255, 255, 255, 0.52) }
.gamepage .xs { color: rgba(255, 255, 255, 0.52) }

.tin {
  width: 100%; height: 44px; border-radius: 9px;
  padding: 0 12px; font-size: 13.5px;
  border: 1px solid var(--line);
}
.tin.code {
  text-align: center; letter-spacing: 6px;
  font-size: 18px; font-weight: 700;
}


.errbox {
  margin-top: 10px; padding: 10px 12px; border-radius: 9px;
  background: rgba(224,113,79,.2); color: #F0A38C;
  font-size: 12px; text-align: center;
}

.entry-tip {
  margin-top: 13px; font-size: 10.5px;
  color: rgba(255, 255, 255, 0.52); line-height: 1.9; text-align: center;
}


.codecard {
  text-align: center; padding: 20px 15px 17px;
  border-radius: var(--r-3); margin-bottom: var(--gap-3);
  background: linear-gradient(135deg, rgba(232,179,60,.2), rgba(232,179,60,.08));
  border: 1.5px solid rgba(232,179,60,.4);
}
.codecard:active { opacity: .85 }
.cc-lbl { font-size: 10.5px; color: rgba(246,231,195,.6); letter-spacing: 1px }
.cc-code {
  font-size: 38px; font-weight: 700; color: #F6E7C3;
  letter-spacing: 7px; margin: 7px 0 5px;
  text-shadow: 0 2px 10px rgba(232,179,60,.35);
  animation: codeIn .5s cubic-bezier(.34, 1.56, .64, 1) backwards;
}
@keyframes codeIn {
  0%   { opacity: 0; transform: scale(.7) }
  100% { opacity: 1; transform: scale(1) }
}
.cc-hint { font-size: 10.5px; color: rgba(246,231,195,.5) }


.plist { margin-bottom: 13px }
.pitem {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 12px; margin-bottom: 6px;
  border-radius: var(--r-2);
  background: rgba(255,255,255,.06);
  border: 1px solid transparent;
  animation: pIn .32s cubic-bezier(0, 0, .2, 1) backwards;
}
.pitem.me {
  background: rgba(232,179,60,.14);
  border-color: rgba(232,179,60,.3);
}
@keyframes pIn {
  from { opacity: 0; transform: translateX(-12px) }
  to   { opacity: 1; transform: translateX(0) }
}
.pseat {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.12);
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75);
}
.pitem.me .pseat { background: rgba(232,179,60,.35); color: #F6E7C3 }
.pname { flex: 1; font-size: 13.5px; color: rgba(255,255,255,.88); display: flex; align-items: center; gap: 6px }
.ptag {
  font-size: 9px; padding: 1px 5px; border-radius: 499.5px;
  background: rgba(255,255,255,.14); color: rgba(255,255,255,.6);
}
.ptag.host { background: rgba(232,179,60,.3); color: #F6E7C3 }
.pdot {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: rgba(255,255,255,.2);
}
.pdot.on { background: #6D9E6A; box-shadow: 0 0 0 2.5px rgba(109,158,106,.22) }

.waiting {
  text-align: center; padding: 15px;
  font-size: 12px; color: rgba(255, 255, 255, 0.52);
}


.bidbar {
  text-align: center;
  
  padding: 11px 0 8px;
}
.bid-lbl { font-size: 10.5px; color: rgba(255, 255, 255, 0.52); letter-spacing: 1.5px }
.bid-val {
  
  font-family: 'BebasNum', -apple-system, sans-serif; font-size: 22px; font-weight: 700; color: #F6E7C3; margin-top: 3px; letter-spacing: 1px }
.bid-val.hint { font-size: 13.5px; color: rgba(255, 255, 255, 0.52); font-weight: 400 }
.bid-by { font-size: 10.5px; color: rgba(255, 255, 255, 0.52); margin-top: 4px }



.dicebox { display: flex; flex-wrap: wrap; gap: 5px; align-items: center }
.dicebox.mini { gap: 4px }
.die-img { width: 31px; height: 33px }
.dicebox.mini .die-img { width: 25px; height: 26.5px }



.cupscene {
  position: relative;
  
  height: 280px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
  border-radius: var(--r-2);
  overflow: hidden;
}


.cs-felt-img {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  width: 100%; height: 100%;
  
  opacity: .92;
}


.cs-prop {
  position: absolute;
  width: 23px; height: 25px;
  opacity: .5;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
  pointer-events: none;
}
.cs-prop.p1 { left: 13px; bottom: 23px; transform: rotate(-18deg) }
.cs-prop.p2 { right: 15px; bottom: 38px; transform: rotate(24deg); opacity: .38 }


.cs-felt {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  background:
    
    radial-gradient(ellipse 78% 58% at 50% 42%,
      rgba(92,74,58,.30) 0%, rgba(38,29,23,.55) 46%, rgba(24,18,15,.9) 100%);
}


.cs-spot {
  position: absolute; left: 50%; top: -30%;
  width: 150%; height: 130%;
  margin-left: -75%;
  background: radial-gradient(ellipse 42% 52% at 50% 40%,
    rgba(255, 228, 170, .15) 0%,
    rgba(255, 220, 150, .07) 38%,
    rgba(255, 210, 140, 0) 68%);
  pointer-events: none;
  animation: candle 4.8s ease-in-out infinite;
}
@keyframes candle {
  0%   { opacity: .86; transform: scale(1)     translateX(0) }
  28%  { opacity: 1;   transform: scale(1.03)  translateX(-3px) }
  52%  { opacity: .82; transform: scale(.99)   translateX(2px) }
  74%  { opacity: .96; transform: scale(1.015) translateX(-1.5px) }
  100% { opacity: .86; transform: scale(1)     translateX(0) }
}


.cs-dice {
  position: absolute; left: 50%;
  bottom: 16px;
  width: 153px;                       
  margin-left: -76.5px;
  display: flex; align-items: center; justify-content: center;
  flex-wrap: nowrap;
  gap: 2px;
  z-index: 1;
  opacity: 0;
  transition: opacity .18s ease;
}
.cs-dice.show { opacity: 1 }
.cs-die {
  width: 29px; height: 31px;
  flex: none;
  
  animation: dieDrop .5s cubic-bezier(.34, 1.4, .64, 1) backwards;
  animation-delay: calc(var(--i) * 90ms);
}
@keyframes dieDrop {
  0%   { opacity: 0; transform: translateY(-23px) rotate(-24deg) scale(.8) }
  60%  { opacity: 1; transform: translateY(3px) rotate(4deg) scale(1.05) }
  100% { opacity: 1; transform: translateY(0) rotate(0) scale(1) }
}


.cs-cup {
  position: absolute; left: 50%;
  bottom: 0;
  width: 180px; height: 280px;
  margin-left: -90px;
  z-index: 3;
  
  filter: drop-shadow(0 5px 11px rgba(0, 0, 0, .5));
  transition: transform .38s cubic-bezier(.34, 1.4, .64, 1),
              opacity .3s ease;
}


.cs-cup.shaking {
  animation: cupShake .34s ease-in-out infinite;
}
@keyframes cupShake {
  0%   { transform: translate(0, 0) rotate(-4deg) }
  25%  { transform: translate(-4px, -9px) rotate(5deg) }
  50%  { transform: translate(3px, -1.5px) rotate(-3deg) }
  75%  { transform: translate(-2.5px, -6.5px) rotate(3deg) }
  100% { transform: translate(0, 0) rotate(-4deg) }
}


.cs-cup.slam {
  animation: cupSlam .38s cubic-bezier(.36, .07, .19, .97);
}
@keyframes cupSlam {
  0%   { transform: translateY(-20px) scale(1.04) }
  35%  { transform: translateY(-26px) scale(1.05) }   
  70%  { transform: translateY(4px) scale(.97) }      
  100% { transform: translateY(0) scale(1) }
}


.cs-cup.lift {
  transform: translateY(-100px) rotate(-9deg) scale(.70);
  opacity: 0;
}
.cs-cup.gone { opacity: 0; transform: translateY(-180px) rotate(-14deg) scale(.66) }


.cs-cup.into {
  animation: cupInto .42s cubic-bezier(.34, 1.4, .64, 1);
}
@keyframes cupInto {
  0%   { transform: translateY(0) scale(1) }
  30%  { transform: translateY(-3.5px) scale(1.015) }
  60%  { transform: translateY(1.5px) scale(.995) }
  100% { transform: translateY(0) scale(1) }
}


.cs-cup.peek {
  transform: translateY(-27.5px) rotate(-7deg) scale(.72);
}


.cs-hint {
  text-align: center;
  font-size: 12px;
  color: rgba(246,231,195,.55);
  height: 17px;
  line-height: 17px;
  margin-bottom: 6px;
  pointer-events: none;
}


.othercups {
  display: flex; flex-wrap: wrap; gap: 9px;
  justify-content: center;
  margin-bottom: 12px;
}
.oc-item {
  width: 75px;
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 4px; border-radius: var(--r-2);

.wheelscene {
  position: relative;
  width: 280px; height: 280px;
  margin: 10px auto 0;
}

.ws-pointer {
  position: absolute; left: 50%; top: -5px;
  margin-left: -10px;
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 20px solid #7A5A18;          
  z-index: 6;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.65));
}
.ws-pointer::before {
  content: ''; position: absolute;
  left: -8px; top: -20px;
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 16.5px solid #E8B33C;          
}
.ws-pointer::after {
  content: ''; position: absolute;
  left: -3.5px; top: -19px;
  width: 0; height: 0;
  border-left: 3.5px solid transparent;
  border-right: 3.5px solid transparent;
  border-top: 12px solid rgba(255, 244, 214, .78);   
}
.ws-disc {
  position: absolute; left: 0; top: 0;
  width: 280px; height: 280px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow:
    0 0 0 1.5px rgba(122, 90, 24, .5),        
    0 0 0 4.5px rgba(232, 179, 60, .30),      
    0 0 0 5.5px rgba(122, 90, 24, .35),      
    inset 0 0 20px rgba(0, 0, 0, .28),      
    0 8px 22px rgba(0, 0, 0, .55);
  
  transition: transform 2.7s cubic-bezier(.4, 0, .2, 1);
}
.ws-lbl {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 10.5px; color: #fff; font-weight: 600;
  
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,.7);
  pointer-events: none;
}

.ws-hub {
  position: absolute; left: 50%; top: 50%;

  border-radius: 50%;

  0%   { opacity: 0; transform: scale(1.28) rotate(-2.2deg) }
  58%  { opacity: 1; transform: scale(.975) rotate(.7deg) }
  100% { opacity: 1; transform: scale(1) rotate(0deg) }
}
.uw-out { animation: slamIn .44s cubic-bezier(.34, 1.2, .64, 1) both }
.uw-reveal { animation: slamIn .5s cubic-bezier(.34, 1.2, .64, 1) both }
.pk-last { animation: slamIn .42s cubic-bezier(.34, 1.2, .64, 1) both }
.pk-reveal { animation: slamIn .5s cubic-bezier(.34, 1.2, .64, 1) both }


@keyframes pickedPop {
  0%   { transform: scale(.97) }
  60%  { transform: scale(1.015) }
  100% { transform: scale(1) }
}
.uw-p.picked { animation: pickedPop .22s cubic-bezier(.34, 1.56, .64, 1) both }

.rl-dice {

  border-radius: 9px;
  background: linear-gradient(145deg, #FFFDF9, #E8DED0);
  box-shadow: 0 5px 13px rgba(0,0,0,.4);
  animation: rlTumble 1.15s cubic-bezier(.4, 0, .2, 1) infinite;
}
@keyframes rlTumble {
  0%   { transform: rotate(0deg) translateY(0) }
  25%  { transform: rotate(90deg) translateY(-7px) }
  50%  { transform: rotate(180deg) translateY(0) }
  75%  { transform: rotate(270deg) translateY(-7px) }
  100% { transform: rotate(360deg) translateY(0) }
}

.rl-face {
  position: absolute; width: 7px; height: 7px; border-radius: 50%;
  background: #C4573A;
}
.rl-f1 { left: 10px; top: 10px }
