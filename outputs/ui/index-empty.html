<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=375,initial-scale=1">
<style>
  html, body { margin:0; padding:0; }
  body { width:375px; min-height:100%; }
  /* 小程序里 <image> 未指定尺寸时按 320x240 的默认盒子渲染 ——
     这里照样给默认值，才能让「忘了写尺寸」的坑在截图上暴露出来 */
  img { display:inline-block; width:320px; height:240px; vertical-align:middle; }
  div { display:block; }
  input, textarea { font-family:inherit; font-size:inherit; border:none; outline:none; background:none; }
  input::placeholder, textarea::placeholder { color:#A39B90; }
  /* 小程序 view 默认 flex-direction:column */
  .wx-hint, .hint { }
</style>
<style> body {
  --brand: #E0714F;        
  --brand2: #C4573A;       
  --brandsoft: #F5DDD3;
  --gold: #E8B33C;         
  --goldsoft: #F6E7C3;
  --blue: #5E7FA6;         
  --bluesoft: #E4EBF3;
  --green: #6D9E6A;        
  --greensoft: #EAF0E9;
  --bg: #F5F0EA;           
  --card: #FFFDF9;
  --ink: #2C2822;
  --ink2: #6E675E;
  --ink3: #A39B90;
  --line: #E7DFD3;

  
  --gap-1: 8px;
  --gap-2: 12px;
  --gap-3: 16px;

  
  --sh-1: 0 1px 4px rgba(88, 68, 48, .045);   
  --sh-2: 0 3px 10px rgba(88, 68, 48, .075);  
  --sh-3: 0 6px 16px rgba(88, 68, 48, .11);  

  
  --r-1: 8px;   
  --r-2: 12px;   
  --r-3: 16px;   

  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

view, text, button, input, textarea { box-sizing: border-box }


.card {
  background: var(--card);
  border-radius: var(--r-2);
  padding: 14px;
  margin-bottom: var(--gap-2);
  box-shadow: var(--sh-1);
}
.card.hl { border: 1.5px solid var(--brand); box-shadow: var(--sh-2) }
.card.flat { background: #F5F1EB; box-shadow: none }

.lbl {
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 7px;
}
.q { font-size: 16px; font-weight: 600; line-height: 1.5 }
.note { font-size: 11.5px; color: var(--ink2); line-height: 1.7 }
.sm { font-size: 11.5px }
.xs { font-size: 10.5px; color: var(--ink3); line-height: 1.6 }


.hero {
  background: linear-gradient(135deg, #E0714F, #C4573A);
  color: #fff;
  border-radius: 14px;
  padding: 16px 14px;
  margin-bottom: 12px;
}
.hero .big { font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -1px }
.hero .sub { font-size: 11.5px; opacity: .9; margin-top: 5px }


.btn {
  height: 44px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  background: #F0EAE1;
  color: var(--ink2);
}
.btn.main { background: var(--brand); color: #fff }
.btn.ok { background: var(--greensoft); color: var(--green) }
.btn.ghostb { background: transparent; border: 1px solid var(--brand); color: var(--brand2) }
.btn.on { background: var(--brand); color: #fff }
.btn:active { opacity: .82 }
.btn.disabled { opacity: .45 }


.pill {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 499.5px;
  background: var(--brandsoft);
  color: var(--brand2);
  font-weight: 600;
}
.pill.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink3); font-weight: 400 }
.pill.gold { background: var(--goldsoft); color: #8A6A22 }
.pill.green { background: var(--greensoft); color: var(--green) }
.pill.blue { background: var(--bluesoft); color: var(--blue) }


.who { display: flex }
.av {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
}
.av.a { background: var(--brand) }
.av.b { background: var(--blue); margin-left: -7px; box-shadow: 0 0 0 2px var(--bg) }


.side { border-radius: 10px; padding: 11px 12px; font-size: 13px; line-height: 1.75 }
.side.ta { background: var(--bluesoft) }
.side.me { background: var(--brandsoft) }
.side .n { font-size: 11px; color: var(--ink2); margin-bottom: 4px; display: flex; align-items: center; gap: 4px }
.rd { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block }
.rd.b { background: var(--blue) }


.lockbar {
  display: flex; align-items: center; gap: 7px;
  background: #F5F1EB; border-radius: 10px;
  padding: 10px 11px; font-size: 11.5px; color: var(--ink2);
  margin-bottom: 11px;
}


.ta {
  width: 100%; height: 140px;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 11px; font-size: 13.5px; line-height: 1.75;
  background: #FDFBF8;
}
.cnt { text-align: right; font-size: 10.5px; color: var(--ink3); margin-top: 4px }


.row2 { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line) }
.row2:last-child { border-bottom: none }
.ico { width: 32px; height: 32px; border-radius: 50%; background: #F2ECE4; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0 }
.gt { font-size: 13px; font-weight: 600 }
.cd { font-size: 10.5px; font-weight: 700; color: var(--brand2); background: var(--brandsoft); padding: 4px 7px; border-radius: 7px; flex-shrink: 0 }
.cd.far { background: #F2ECE4; color: var(--ink2); font-weight: 400 }


.mile { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 3px }
.m { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; color: var(--ink3); flex: 1 }
.m .bar { width: 100%; height: 3px; background: var(--line); border-radius: 1.5px }
.m .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line) }
.m.done .dot { background: var(--gold) }
.m.done { color: var(--ink2) }
.m.now .dot { background: var(--brand); box-shadow: 0 0 0 3px var(--brandsoft) }
.m.now { color: var(--brand2); font-weight: 700 }


.chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px }
.chiprow .pill { flex: none }



.page { padding: 14px 14px calc(70px + env(safe-area-inset-bottom)) }
.empty { text-align: center; padding: 40px 20px; color: var(--ink3); font-size: 12.5px; line-height: 1.8 }
.divider { height: 1px; background: var(--line); margin: 12px 0 }





.mi { width: 1em; height: 1em; vertical-align: -0.14em; margin-right: 3px; }


.bigicon { width: 48px; height: 48px; }
.bigicon.sm { width: 34px; height: 34px; }


.tick { width: 13px; height: 13px; }


.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-3); margin-bottom: var(--gap-3);
  background: linear-gradient(135deg, #E88060 0%, #D9603E 55%, #C24E2F 100%);
  box-shadow: var(--sh-3);
}
.hero-glow {
  position: absolute; width: 210px; height: 210px; border-radius: 50%;
  right: -70px; top: -90px;
  background: radial-gradient(circle, rgba(255,225,200,.42) 0%, rgba(255,225,200,0) 68%);
}

.hero-inner { position: relative; padding: 17px 17px 15px; }
.hero-label { font-size: 11.5px; color: rgba(255,255,255,.82); letter-spacing: 1.5px }
.hero-num { display: flex; align-items: baseline; margin: 3px 0 5px }
.hero-big { font-size: 50px; font-weight: 700; color: #fff; line-height: 1; letter-spacing: -1.5px }
.hero-unit { font-size: 15px; color: rgba(255,255,255,.9); margin-left: 5px }
.hero-line { font-size: 12px; color: rgba(255,255,255,.86); line-height: 1.6 }
.hero-next {
  display: inline-block; margin-top: 8px; padding: 5px 11px;
  background: rgba(255,255,255,.2); border-radius: 499.5px;
  font-size: 11px; color: #fff;
}

.hn-ic {
  width: 12px; height: 12px;
  display: inline-block;
  vertical-align: -1.5px;
  margin-right: 4px;
}



.writecard {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 16px; margin-bottom: var(--gap-3);
  border-radius: var(--r-3);
  background: linear-gradient(135deg, #FFFBF4, #FDF1E4);
  border: 1.5px solid #F2D9C4;
  box-shadow: var(--sh-2);
}
.writecard:active { transform: scale(.985) }
.wc-title { font-size: 18px; font-weight: 700; color: var(--brand2); letter-spacing: 0.5px }
.wc-sub { font-size: 11.5px; color: #B08066; margin-top: 4px }

.wc-pen {
  width: 43px; height: 43px; flex: none;
  box-sizing: border-box;
  padding: 10px;
  border-radius: 50%;
  background: linear-gradient(135deg, #F0C25A, #DDA22C);
  box-shadow: 0 3px 9px rgba(206,87,56,.34);
}


.sechead {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 4px 3px 9px;
  font-size: 12px; color: var(--ink3); letter-spacing: 1px;
}
.sechead .more { color: var(--brand2); font-size: 11px; letter-spacing: 0 }


.mcard {
  background: var(--card); border-radius: 14px;
  padding: 13px 14px; margin-bottom: 10px;
  box-shadow: 0 1.5px 5px rgba(70,55,40,.05);
}
.mc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px }
.mc-who { font-size: 12px; font-weight: 700; color: var(--brand2) }
.mc-who.ta { color: var(--blue) }
.mc-time { font-size: 10.5px; color: var(--ink3) }
.mc-text { font-size: 14px; line-height: 1.75; color: var(--ink) }

.mc-photos { display: flex; gap: 5px; margin-top: 8px }
.mc-photo {
  flex: 1; min-width: 0;
  height: 110px; border-radius: 9px;
  background: #EFE8DE;
}

.mc-photos.single .mc-photo { height: 170px }
.mc-hint { font-size: 9.5px; color: #C9BEB2; margin-top: 7px; text-align: right }


.today-card {
  position: relative; margin-bottom: 12px;
  padding: 15px 15px 13px;
  border-radius: 15px;
  background: linear-gradient(135deg, #FFF6E4, #FBE9CE);
  border: 1px solid #F0D9AE;
}
.tc-badge {
  display: inline-block; padding: 2.5px 9px; border-radius: 499.5px;
  background: rgba(232,179,60,.25); color: #8A6A22;
  font-size: 10px; margin-bottom: 7px; letter-spacing: 0.5px;
}
.tc-row { font-size: 13px; line-height: 1.7; color: #4A3A15 }
.tc-who { font-weight: 700; margin-right: 5px; color: #8A6A22 }


.gentle { text-align: center; padding: 35px 25px 30px }
.gentle-icon { width: 38px; height: 38px; opacity: .8 }
.gentle-t { font-size: 15px; font-weight: 600; color: var(--ink2); margin-top: 8px }
.gentle-s { font-size: 12px; color: var(--ink3); line-height: 1.8; margin-top: 6px }


.loadheart {
  
  width: 40px; height: 40px;
  animation: beat 1s infinite
}
@keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }


.coolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 15px; margin-bottom: 12px;
  background: linear-gradient(135deg, #F3F6F1, #E8EFE6);
  border-radius: 13px; border: 1px solid #D6E2D3;
}
.coolbar.need {
  background: linear-gradient(135deg, #FFF6EC, #FBE7D6);
  border-color: #F0D9C4;
}
.coolbar .cb-t { color: #4C6B49 }
.coolbar .cb-s { color: #7C9379 }
.coolbar .cb-r { color: #A8BCA5 }
.coolbar.need .cb-t { color: #8A5A32 }
.coolbar.need .cb-s { color: #A8845E }
.coolbar.need .cb-r { color: #C9A98A }
.coolbar:active { opacity: .85 }


.gamebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 15px; margin-bottom: var(--gap-2);
  background: linear-gradient(135deg, #3E2E28, #2E211C);
  border-radius: var(--r-2);
  box-shadow: var(--sh-2);
}
.gamebar:active { opacity: .9 }
.gamebar .cb-t { color: #F6E7C3 }
.gamebar .cb-s { color: rgba(246,231,195,.55) }
.gamebar .cb-r { color: rgba(246,231,195,.5) }


.capsulebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 15px; margin-bottom: 12px;
  background: linear-gradient(135deg, #F4F6FB, #E9EDF6);
  border-radius: 13px; border: 1px solid #DCE3F0;
}
.capsulebar:active { background: #E9EDF6 }
.cb-l { display: flex; align-items: center; gap: 8px }
.cb-e { width: 20px; height: 20px; flex-shrink: 0 }
.cb-t { font-size: 13.5px; font-weight: 600; color: #4E5B7A }
.cb-s { font-size: 10.5px; color: #8492AD; margin-top: 2px }
.cb-r { font-size: 14px; color: #A8B4CC }


.remindbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 15px; margin-bottom: 12px;
  background: #F7F4EE; border-radius: 13px; border: 1px solid #EAE2D6;
}
.remindbar.hot { background: linear-gradient(135deg, #FFEFE0, #FBDFC6); border-color: #F0C9A4 }
.remindbar:active { opacity: .85 }
</style>
</head><body>
